function start(){cleanup();matches=miss=elapsed=0;first=-1;active=false;lock=true;let choices=shuffle(Array.from({length:20},(_,i)=>i)).slice(0,count/2);deck=shuffle(choices.flatMap(id=>[{id,open:mode==='memory',matched:false},{id,open:mode==='memory',matched:false}]));$('overlay').classList.add('hidden');$('again').classList.add('hide');$('closeModal').classList.add('hide');$('note').textContent=mode==='memory'?'カードの ばしょを おぼえよう！':'おなじ すしエナガを みつけよう！';stats();render();if(mode==='memory'){let left=seconds;$('modalTitle').textContent='👀 じゅんび！';$('countdown').textContent=left;$('modalText').textContent='おぼえる じかんだよ！ ぜんぶ みてね';/* Keep preview visible; countdown floats as a small overlay label above the cards rather than hiding them. */$('countdown').textContent=left;$('overlay').classList.add('hidden');let label=$('note');label.textContent=`👀 あと ${left}びょう！ ばしょを おぼえてね`;previewTimer=setInterval(()=>{left--;label.textContent=`👀 あと ${Math.max(0,left)}びょう！ ばしょを おぼえてね`;if(left<=0){clearInterval(previewTimer);deck.forEach(x=>x.open=false);render();begin();label.textContent='スタート！ おぼえたカードを タッチ！';speak('スタート！')}},1000)}else begin()}
function begin(){lock=false;active=true;clockTimer=setInterval(()=>{elapsed++;stats()},1000)}
function flip(i){if(!active||lock||deck[i].open||deck[i].matched)return;deck[i].open=true;render();if(first<0){first=i;return}let previous=first;first=-1;lock=true;if(deck[i].id===deck[previous].id){deck[i].matched=deck[previous].matched=true;matches++;let id=deck[i].id;if(!discovered.includes(id)){discovered.push(id);store.set('sushienaga-collected-v3',discovered);renderBook()}$('note').textContent='やったね！ ぴったり！ 💕';stats();render();if(matches===count/2){finish();return}turnTimer=setTimeout(()=>{lock=false},350)}else{miss++;stats();$('note').textContent='おしい！ もういちど 🌸';turnTimer=setTimeout(()=>{deck[i].open=false;deck[previous].open=false;lock=false;render()},1050)}}
function finish(){active=false;lock=true;clearInterval(clockTimer);let key='sushienaga-v3-'+mode+'-'+count;const previous=store.get(key,null);if(!previous||miss<previous.miss||(miss===previous.miss&&elapsed<previous.elapsed))store.set(key,{miss,elapsed});showRecords();$('modalTitle').textContent='🎉 ぜんぶ そろった！';$('countdown').textContent='💮';$('modalText').textContent=`${matches}ペア せいこう！ ミス ${miss}かい・${elapsed}びょう`; $('again').classList.remove('hide');$('closeModal').classList.remove('hide');$('note').textContent='ぜんぶ できたね！ おめでとう！';turnTimer=setTimeout(()=>{$('overlay').classList.remove('hidden');speak('すごい！ぜんぶそろったね！')},450)}
function renderBook(){$('collected').textContent=`あつめた すしエナガ：${discovered.length}/20 しゅるい`;$('book').innerHTML=DATA.map((c,i)=>`<div class="entry ${discovered.includes(i)?'':'locked'}">${c.img?`<img src="${c.img}" alt="">`:`<div class="extra" style="background:${c.color}"><img src="${bird}" alt=""><span>${c.emoji}</span></div>`}<div>${discovered.includes(i)?c.name:'？？？'}</div></div>`).join('')}
function showRecords(){let r=store.get('sushienaga-v3-'+mode+'-'+count,null);$('records').textContent=r?`このコースの さいこう：ミス ${r.miss}かい・${r.elapsed}びょう`:'このコースは まだ きろくが ないよ'}
$('start').addEventListener('click',function(){start();showRecords()},{passive:true});$('again').onclick=()=>{start();showRecords()};$('closeModal').onclick=()=>$('overlay').classList.add('hidden');$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 おと：オン':'🔇 おと：オフ'};$('resetRecords').onclick=()=>{if(confirm('きろくを ぜんぶ けしますか？')){for(let m of ['normal','memory'])for(let n of [6,12,20,40]){try{localStorage.removeItem('sushienaga-v3-'+m+'-'+n)}catch(e){}}showRecords()}};renderBook();stats();showRecords();$('touchStatus').textContent='✅ ゲームのじゅんびOK！';
</script><script>window.addEventListener("error",function(e){var n=document.getElementById("touchStatus");if(n)n.textContent="⚠️ 読み込みエラー：Safariで開いてね";});</script></body></html>
